services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixelplace
      POSTGRES_PASSWORD: pixelplace
      POSTGRES_DB: pixelplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelplace -d pixelplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pixelplace:pixelplace@postgres:5432/pixelplace
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32chars-minimum!!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SOCKET_PATH: /socket.io
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy

  # Next.js frontend: run locally (`npm run dev -w frontend`) or build a separate image when ready.
  # web:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_BACKEND_URL: http://api:4000

volumes:
  pgdata:
