# Pixel Place onion origin.
# Bind loopback only so the site is not reachable on the public internet.
# Tor maps HiddenServicePort 80 -> 127.0.0.1:8080
# and HiddenServicePort 443 -> 127.0.0.1:8443.
# Port 443 exists because Tor Browser HTTPS-Only Mode upgrades .onion to https
# and times out if nothing accepts TLS.

server {
    listen 127.0.0.1:8080 default_server;
    listen [::1]:8080 default_server;
    listen 127.0.0.1:8443 ssl default_server;
    listen [::1]:8443 ssl default_server;

    ssl_certificate     /etc/nginx/pixelplace-onion.crt;
    ssl_certificate_key /etc/nginx/pixelplace-onion.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_name _;
    server_tokens off;

    root /var/www/pixelplace-onion;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;

    access_log /var/log/nginx/pixelplace-onion.access.log;
    error_log  /var/log/nginx/pixelplace-onion.error.log;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
