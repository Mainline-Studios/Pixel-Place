# Pixel Place onion origin.
# Bind loopback only so the site is not reachable on the public internet.
# Tor maps HiddenServicePort 80 -> 127.0.0.1:8080.

server {
    listen 127.0.0.1:8080 default_server;
    listen [::1]:8080 default_server;

    server_name _;
    server_tokens off;

    root /var/www/pixelplace-onion;
    index index.html;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
    add_header X-Robots-Tag "noindex, nofollow, noarchive";

    access_log /var/log/nginx/pixelplace-onion.access.log;
    error_log  /var/log/nginx/pixelplace-onion.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
