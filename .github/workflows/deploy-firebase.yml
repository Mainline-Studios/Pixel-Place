name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps & build app
        run: |
          npm ci
          NEXT_OUTPUT_EXPORT=true npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build functions
        run: |
          cd functions
          npm ci
          npm run build

      - name: Skip deploy when token is missing
        if: ${{ env.FIREBASE_TOKEN == '' }}
        run: echo "FIREBASE_TOKEN is not configured; skipping Firebase deploy."

      # Firebase CLI sometimes exits 1 even when deploy succeeds (warnings/deprecations).
      # Capture log and verify success from output so the job doesn't fail incorrectly.
      - name: Deploy to Firebase
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: |
          firebase deploy --token "$FIREBASE_TOKEN" --non-interactive 2>&1 | tee deploy.log || true
        env:
          CI: true

      - name: Verify deploy succeeded
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: |
          if grep -q "Deploy complete!" deploy.log; then
            echo "Deploy completed successfully (verified from log)."
            exit 0
          fi
          echo "Deploy did not complete. Last 30 lines of log:"
          tail -30 deploy.log
          exit 1
