name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps & build app
        run: |
          npm ci
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build functions
        run: |
          cd functions
          npm ci
          npm run build

      - name: Skip deploy when token is missing
        if: ${{ env.FIREBASE_TOKEN == '' }}
        run: echo "FIREBASE_TOKEN is not configured; skipping Firebase deploy."

      - name: Deploy to Firebase
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: firebase deploy --token "$FIREBASE_TOKEN"
        env:
          CI: true
