name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Hosting predeploy (firebase.json) runs `npm run build`; functions predeploy builds functions.
      - name: Install root & functions deps
        run: |
          npm ci
          cd functions && npm ci && cd ..

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Skip deploy when token is missing
        if: ${{ env.FIREBASE_TOKEN == '' }}
        run: echo "FIREBASE_TOKEN is not configured; skipping Firebase deploy."

      # Firebase CLI sometimes exits 1 even when deploy succeeds (warnings/deprecations).
      # Capture log and verify success from output so the job doesn't fail incorrectly.
      # Hosting predeploy runs `npm run build` — NEXT_PUBLIC_* must be set here (GitHub repo secrets).
      - name: Deploy to Firebase
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: |
          firebase deploy --token "$FIREBASE_TOKEN" --non-interactive 2>&1 | tee deploy.log || true
        env:
          CI: true
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}

      - name: Verify deploy succeeded
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: |
          if grep -q "Deploy complete!" deploy.log; then
            echo "Deploy completed successfully (verified from log)."
            exit 0
          fi
          echo "Deploy did not complete. Last 30 lines of log:"
          tail -30 deploy.log
          exit 1
